<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интернет нест - Илмисино</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px 0;
      color: #0f172a;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #64748b;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      background: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #ecfdf5;
      color: #047857;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <div class="badge">Ҳолати офлайн (Offline)</div>
    <h1>Интернет нест, аммо мавзӯъҳои дарсшуда дастрасанд</h1>
    <p>
      Шумо метавонед ҳамаи мавзӯъҳо, конспектҳо ва саволҳои қаблан омӯхтаатонро дар таърих бе пайвасти интернет мутолиа кунед.
    </p>
    <a href="/" class="btn">Гузаштан ба барнома ва таърих</a>
  </div>
</body>
</html>
